# The complete declarative description of this cache.
#
# One file, read by both the shared orchestration and this cache's own update code, so the two
# cannot disagree. It replaces what used to be spread across `code/update_pipeline.sh`, the update
# workflow, `dataset_description.json`, and the constants at the top of `code/update.py`.

[cache]
name = "usage-dandiset-path-to-asset-size"

# Upstream cache, registered as a DataLad input subdataset and pinned in every run's provenance.
# It names the one Dandiset each content ID is attributed to, which is both the set of content IDs
# this cache resolves and the way it decides which Dandisets to read this run.
[[inputs]]
name = "content-id-to-usage-dandiset-path"

# Reading every manifest of every Dandiset is heavy enough that a single run cannot clear a cold
# backlog, so a run advances it by a bounded number of Dandisets. The shell script carried this
# number; it is declared once here.
[operations.update]
limit = 2000

# The published branches describe this repository as a BIDS study dataset, through a
# `dataset_description.json` with `DatasetType: "study"`. The pipeline renders that file from this
# section at the start of every run, so the repository no longer carries it by hand.
[description]
authors = ["Cody Baker"]
